name: Type Check
on:
  workflow_call:
jobs:
  kotlin-compile:
    name: Kotlin Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin
